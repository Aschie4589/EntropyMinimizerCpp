# Phase 1 Configuration

# Workflow-specific configuration
config:
  params:
    N: [1024, 2048]
    d: [30, 40]
    eps: 1e-6
    moe-tensor-estimation:
      eps: 1e-6
    channel-gen:
      num-channels: 4
    first-pass:
      iters: 1000
      num-vectors: 10
      vec-survival: 0.2 # Top 20% of vectors survive
    second-pass:
      iters: 20000
      vec-survival: 0.1 # Top 10% of remaining vectors survive
      channel-survival: 0.2 # Top 20% of channels survive
    third-pass:
      iters: 500000
  output:
    output-directory: "/home/aschie4589/Projects/EntropyMinimizerCpp/results/phase1"
    index-yaml: "index.yml"
    info-yaml: "info.yml"
    vectors-dirname: "vecs"
    first-pass-dirname: "first_pass"
    second-pass-dirname: "second_pass"
    third-pass-dirname: "third_pass"

# Minimizer configuration (used by all passes)
minimizer:
  algorithm:
    epsilon: 1.0e-3
    precision: DOUBLE
    device_id: 0

  stopping:
    # max_iterations is determined by pass-specific iters above
    convergence_tolerance: 1.0e-15
    convergence_window: 20

  prediction:
    enabled: true
    strategy: AUTO
    window_size: 200
    rsquared_threshold: 0.999
    convergence_tolerance: 1.0e-15
    min_data_points: 100

  checkpoint:
    enabled: false
    interval: 10000
    directory: checkpoints/

  logging:
    enabled: true
    level: INFO
    file_path: phase1.log
    log_interval: 100
    print_to_console: true
    color_enabled: true

  multi_run:
    # num_attempts determined by workflow logic
    track_global_moe: true
    restart_on_failure: false

  resource:
    gpu_config_file: "/home/aschie4589/Projects/EntropyMinimizerCpp/configs/gpu_config.yaml"
    allow_dynamic_scaling: true
    poll_interval: 1000
    desired_gpus: 4                # Number of GPUs to use (0 = CPU only)
    desired_cpus: 0                # Number of CPU workers
    gpu_policy: MOST_FREE_MEMORY
    fallback_to_cpu: false  



# Folder structure:
# results/
# └── phase1/
#     ├── channel1uid/
#     │   ├── vecs/
#     │   │   ├── first_pass/
#     │   │   │   ├── initial/
#     │   │   │   |   ├── vec1.dat
#     │   │   │   |   ├── vec2.dat
#     │   │   │   |   └── ...
#     │   │   │   ├── final/
#     │   │   │   │   ├── vec1.dat
#     │   │   │   │   ├── vec2.dat
#     │   │   │   │   └── ...
#     │   │   ├── second_pass/
#     │   │   │   ├── initial/
#     │   │   │   │   └ ...
#     │   │   │   └── final/
#     │   │   │       └ ...
#     │   │   └── third_pass/ <-- only for the best surviving channels
#     │   │   │   ├── initial/
#     │   │   │   │   └ ...
#     │   │   │   └── final/
#     │   │   │       └ ...
#     │   ├── info.json  <-- contains channel parameters and results (eps entropy and estimated entropy). Also contains a list of all initial vectors, with their strings, paths, and entropies, and whether they survived each pass
#     │   └── kraus.dat
#     ├── channel2uid/
#     ├── ...
#     └── index.yml <-- contains list of channels with their unique strings, kraus paths, folders, and whether they survived each pass